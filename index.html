      try { previous = localStorage.getItem(VERSION_KEY); } catch (error) { console.warn("Cache version unavailable", error); }
      if (previous !== CACHE_VERSION) {
        try {
          if ("caches" in window) {
            const names = await caches.keys();
            await Promise.all(names.map(name => caches.delete(name)));
          }
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(registration => registration.unregister()));
          }
        } catch (error) {
          console.warn("Cache cleanup skipped", error);
        }
        try { localStorage.setItem(VERSION_KEY, CACHE_VERSION); } catch (error) { console.warn("Cache version not saved", error); }
      }
      await import(`./src/main.js?v=${CACHE_VERSION}`);
      window.__abyssBootComplete = true;
    }
    refreshStaleAssets();
  </script>
