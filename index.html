  <script type="module">
    const ASSET_VERSION = "3.1.18";
    const ASSET_BUILD = "build337";
    const CACHE_VERSION = `${ASSET_VERSION}-${ASSET_BUILD}`;
    const VERSION_KEY = "abyss-dominion-asset-version";
    async function refreshStaleAssets() {
      const previous = localStorage.getItem(VERSION_KEY);
      if (previous !== CACHE_VERSION) {
        try {
          if ("caches" in window) {
            const names = await caches.keys();
            await Promise.all(names.map(name => caches.delete(name)));
          }
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(registration => registration.unregister()));
          }
        } catch (error) {
          console.warn("Cache cleanup skipped", error);
        }
        localStorage.setItem(VERSION_KEY, CACHE_VERSION);
      }
      await import(`./src/main.js?v=${ASSET_VERSION}-${ASSET_BUILD}`);
    }
    refreshStaleAssets();
  </script>
