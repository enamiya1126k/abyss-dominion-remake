name: Build344 Formation Patch

on:
  push:
    branches: [build344-formation-artifact]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python tools/build344_formation_patch.py

      - name: Validate JavaScript
        run: |
          node --check src/ui/screens/FormationScreen.js
          node --check src/main.js
          node --check src/core/config.js
          grep -q 'build344-formation.css?v=3.1.24-build344' index.html
          grep -q 'FormationScreen.js?v=3.1.24-build344' src/main.js
          grep -q 'formation-circle-level' src/ui/screens/FormationScreen.js

      - name: Stage direct replacement files
        run: |
          mkdir -p patch/src/core patch/src/ui/screens patch/src/Styles
          cp index.html patch/index.html
          cp src/main.js patch/src/main.js
          cp src/core/config.js patch/src/core/config.js
          cp src/ui/screens/FormationScreen.js patch/src/ui/screens/FormationScreen.js
          cp src/Styles/build344-formation.css patch/src/Styles/build344-formation.css
          cp README_BUILD344_FORMATION.txt patch/README_BUILD344_FORMATION.txt

      - name: Upload direct replacement ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ABYSS_Build344_formation_patch_direct
          path: patch/
          retention-days: 7
