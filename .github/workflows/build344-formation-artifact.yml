name: Build344 Formation Patch

on:
  push:
    branches: [build344-formation-artifact]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python tools/build344_formation_patch.py

      - name: Validate JavaScript
        run: |
          node --check src/ui/screens/FormationScreen.js
          node --check src/main.js
          node --check src/core/config.js
          grep -q 'build344-formation.css?v=3.1.24-build344' index.html
          grep -q 'FormationScreen.js?v=3.1.24-build344' src/main.js
          grep -q 'formation-circle-level' src/ui/screens/FormationScreen.js

      - name: Package
        run: |
          zip -9 -r ABYSS_Build344_formation_patch.zip index.html src/main.js src/core/config.js src/ui/screens/FormationScreen.js src/Styles/build344-formation.css README_BUILD344_FORMATION.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ABYSS_Build344_formation_patch
          path: ABYSS_Build344_formation_patch.zip
          retention-days: 7
