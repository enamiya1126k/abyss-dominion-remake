          Path('README_BUILD345_HERO_BALANCE.txt').write_text('''ABYSS DOMINION v3.1.25 / Build345 差し替え\n\n今回の修正\n1. 勇者一行4人を全員 Lv.1500 に統一\n   - えなみ／より／ひで／りおん全員\n   - 遭遇戦・最終決戦とも同じ最終強度\n   - キャンペーン敵専用の全能力1.30倍＋HP1.45倍\n   - 所持済みシリアル版の勇者には影響なし\n   - 4人時の既存「無敵」共鳴・追撃AIは維持\n\n2. 通常戦が軽すぎる問題を調整\n   - 敵ランク補正を強化\n   - 敵の装備所持率と装備枠の解禁を前倒し\n   - 装備なし敵にも階層に応じたHP/攻防/耐性圧を追加\n   - プレイヤー戦力への自動追従は不採用（育成の意味を残す）\n\n3. 勇者戦でスキル一覧を閉じられない問題\n   - 「×」をスキル一覧上部の常時表示ヘッダーへ移動\n   - iPhone Safari下部バーの下へ戻るボタンが沈む構造を廃止\n\n4. 勇者4人の会話\n   - 小っ恥ずかしい帰還・感動会話を撤去\n   - 終始、口癖／ツッコミ／失敗談／金儲け／塩／酒／ザリガニ等の笑い寄りへ\n   - 物語上の危険度だけは維持\n\n5. Build344編成UIを累積収録\n   - 装備6枠を2列×3段ですべて表示\n   - 魔法陣は画像＋Lvだけの縦コンパクト表示\n   - 魔法陣モーダルを黒・金基調へ\n\nオンライン接続認証、オンラインサーバーURL、セーブ形式には変更を加えていません。\n\n差し替え方法\nZIPの中身をGitHub Desktop管理中の abyss-dominion-remake フォルダ直下へ上書きしてください。\n''',encoding='utf-8')
          PY

      - name: Validate Build345
        shell: bash
        run: |
          node --check src/main.js
          node --check src/core/config.js
          node --check src/core/CampaignHeroEncounterSystem.js
          node --check src/core/CampaignStorySystem.js
          node --check src/core/CampaignHeroBranchStorySystem.js
          node --check src/core/EnemyScalingSystem.js
          node --check src/ui/screens/BattleScreen.js
          node --check src/ui/screens/FormationScreen.js
          node --check src/ui/screens/HomeScreen.js
          node --check src/services/SaveService.js
          grep -q 'APP_VERSION="3.1.25"' src/core/config.js
          grep -q 'CAMPAIGN_HERO_FINAL_LEVEL=1500' src/core/CampaignHeroEncounterSystem.js
          grep -q 'CAMPAIGN_HERO_STAT_MULTIPLIER=1.30' src/core/CampaignHeroEncounterSystem.js
          grep -q 'fixedTrialHpMultiplier:CAMPAIGN_HERO_HP_MULTIPLIER' src/main.js
          grep -q 'battle-skill-close-top' src/ui/screens/BattleScreen.js
          grep -q 'formation-circle-level' src/ui/screens/FormationScreen.js
          grep -q 'build345-balance-ui.css?v=3.1.25-build345' index.html
          ! grep -q '待ってくれてありがとう' src/core/CampaignHeroBranchStorySystem.js
          ! grep -q 'おかえりって言えるん' src/core/CampaignHeroBranchStorySystem.js

      - name: Package replacement ZIP
        shell: bash
        run: |
          zip -9 -r ABYSS_Build345_hero_balance_patch.zip \
            index.html \
            src/main.js \
            src/core/config.js \
            src/core/CampaignHeroEncounterSystem.js \
            src/core/CampaignStorySystem.js \
            src/core/CampaignHeroBranchStorySystem.js \
            src/core/EnemyScalingSystem.js \
            src/ui/screens/FormationScreen.js \
            src/ui/screens/BattleScreen.js \
            src/ui/screens/HomeScreen.js \
            src/services/SaveService.js \
            src/Styles/build345-balance-ui.css \
            README_BUILD345_HERO_BALANCE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ABYSS_Build345_hero_balance_patch
          path: ABYSS_Build345_hero_balance_patch.zip
          if-no-files-found: error
          retention-days: 7
