name: Build346 hero synergy hotfix

on:
  push:
    paths:
      - '.github/workflows/build346-hero-synergy-hotfix.yml'

permissions:
  contents: write

jobs:
  apply-build346:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted Build346 changes
        run: python3 tools/build346_hotfix.py

      - name: Syntax and focused regression tests
        run: |
          node --check src/data/mythicSerialSpecies.js
          node --check src/battle/EnemyAI.js
          node --check src/core/CampaignHeroEncounterSystem.js
          node --check src/battle/SkillSystem.js
          node --check src/models/Monster.js
          node --test tests/build346-hero-synergy-regression.mjs

      - name: Build overwrite ZIP
        run: |
          rm -f ABYSS_Build346_hero_synergy_formation_patch.zip
          zip -q ABYSS_Build346_hero_synergy_formation_patch.zip \
            BUILD346_README.txt \
            index.html \
            src/main.js \
            src/Styles/build345-balance-ui.css \
            src/data/mythicSerialSpecies.js \
            src/data/species.js \
            src/battle/EnemyAI.js \
            src/battle/SkillSystem.js \
            src/models/Monster.js \
            src/core/CampaignHeroEncounterSystem.js \
            src/ui/screens/HomeScreen.js \
            src/services/SaveService.js \
            tests/build346-hero-synergy-regression.mjs

      - name: Upload overwrite ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ABYSS_Build346_hero_synergy_formation_patch
          path: ABYSS_Build346_hero_synergy_formation_patch.zip
          if-no-files-found: error
          retention-days: 14

      - name: Commit validated changes and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/build346-hero-synergy-hotfix.yml tools/build346_hotfix.py
          git add \
            BUILD346_README.txt \
            index.html \
            src/main.js \
            src/Styles/build345-balance-ui.css \
            src/data/mythicSerialSpecies.js \
            src/data/species.js \
            src/battle/EnemyAI.js \
            src/battle/SkillSystem.js \
            src/models/Monster.js \
            src/core/CampaignHeroEncounterSystem.js \
            src/ui/screens/HomeScreen.js \
            src/services/SaveService.js \
            tests/build346-hero-synergy-regression.mjs
          git commit -m "Build346 restore formation gear and strengthen hero synergy"
          git push origin HEAD:main
