name: online-cache-hotfix-once

on:
  push:
    paths:
      - '.github/workflows/online-cache-hotfix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-time online cache hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply build342 online hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'missing marker in {path}: {old}')
              s = s.replace(old, new, count)
              p.write_text(s, encoding='utf-8')

          # Force Safari to request the current online client instead of reusing
          # the old build336 module URL from its HTTP cache.
          patch('src/main.js',
                'from"./core/config.js?v=3.1.22-build341";',
                'from"./core/config.js?v=3.1.23-build342";')
          patch('src/main.js',
                'from"./ui/screens/OnlinePartyScreen.js?v=3.1.14-build333";',
                'from"./ui/screens/OnlinePartyScreen.js?v=3.1.23-build342";')
          patch('src/main.js',
                'from"./online/OnlinePartyClient.js?v=3.1.17-build336";',
                'from"./online/OnlinePartyClient.js?v=3.1.23-build342";')

          # The freshly loaded controller must also refresh its online UI/view
          # dependencies so iPhone Safari cannot mix old and current modules.
          patch('src/online/OnlinePartyClient.js',
                '../ui/screens/OnlinePartyScreen.js?v=3.1.12-build331',
                '../ui/screens/OnlinePartyScreen.js?v=3.1.23-build342')
          patch('src/online/OnlinePartyClient.js',
                './OnlineViews.js?v=3.1.19-build338',
                './OnlineViews.js?v=3.1.23-build342')

          patch('src/core/config.js',
                'export const APP_VERSION="3.1.22";',
                'export const APP_VERSION="3.1.23";')

          patch('index.html',
                'const ASSET_VERSION = "3.1.22";',
                'const ASSET_VERSION = "3.1.23";')
          patch('index.html',
                'const ASSET_BUILD = "build341";',
                'const ASSET_BUILD = "build342";')

          # Make handshake failures visible in the already-open server console.
          p = Path('online-server/server.js')
          s = p.read_text(encoding='utf-8')
          old = 'const result=store.hello(socket,message);if(!result.ok)return fail(socket,result);'
          new = 'console.log(`[ONLINE HELLO] protocol=${requestedProtocol||"unknown"} player=${String(message.friendId??"")} background=${message.backgroundOnly===true}`);const result=store.hello(socket,message);if(!result.ok){console.warn(`[ONLINE HELLO FAIL] ${result.code??"UNKNOWN"}: ${result.message??""}`);return fail(socket,result)}console.log(`[ONLINE HELLO OK] player=${result.playerId} background=${Boolean(result.backgroundOnly)}`);'
          if old not in s:
              raise SystemExit('missing server hello marker')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript and hotfix markers
        shell: bash
        run: |
          node --check src/main.js
          node --check src/online/OnlinePartyClient.js
          node --check src/core/config.js
          node --check online-server/server.js
          grep -q 'OnlinePartyClient.js?v=3.1.23-build342' src/main.js
          grep -q 'const ASSET_BUILD = "build342"' index.html
          grep -q 'APP_VERSION="3.1.23"' src/core/config.js

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/main.js src/core/config.js src/online/OnlinePartyClient.js online-server/server.js
          git commit -m "Fix Safari online cache and handshake diagnostics build342"
          git push
