function paint(){const selected=r=>area==='all'||r.area===Number(area);let html='';
if(tab==='changes')html='<h2>今回の更新</h2><div class="grid"><article><b>収集帳を開く</b><p>探索開始 → 第二章 → 限定装備と魔法陣の収集帳。全20種の入手先、所持数、最高＋値／Lv、保管先を表示。未入手だけにも絞れます。</p><small>一度入手した記録は素材に使っても残ります。更新前に失った装備の履歴がない場合は復元できません。</small></article><article><b>同じ段階でもう一度</b><p>精鋭3部隊制圧後、活躍表 → 報酬の順に確認。「もう一度挑戦」で同じ地域・同じ段階の3部隊を再配置。帰還報告と探索開始にも入口があります。</p><small>HP・MP・戦闘不能は引き継ぎ、自動探索はOFFで開始。全員戦闘不能なら先に回復してください。</small></article><article><b>まとめて固有鍛錬</b><p>拠点の装備 → 限定装備の固有鍛錬。同じ限定装備の予備を複数選ぶと、素材数・GOLD合計・完成後の＋値を確認できます。素材1個で＋1、上限＋30。</p><small>ロック・お気に入り・装備中の品は素材に使えません。Lvと厳選は完成品へそのまま残ります。</small></article><article><b>連携を止める攻略</b><p>敵味方とも、相方の行動不能中はペア連携が休止。睡眠・凍結・麻痺・魅了・混乱・恐怖やスタンに対応。解除後にそのラウンドの未使用分から再開します。</p><small>通常の発動回数と威力は維持。行動可能な浄化役は、眠っている別の仲間を引き続き治療できます。</small></article></div><h2>段階ごとの確定報酬</h2><div class="table-wrap"><table><tr><th>段階</th><th>各部隊の限定装備</th><th>3部隊制圧の専用陣</th></tr><tr><td>1・精鋭</td><td>LR ＋12</td><td>Lv.5</td></tr><tr><td>2・覇者</td><td>神話 ＋18</td><td>Lv.15</td></tr><tr><td>3・極冠</td><td>神話 ＋24</td><td>Lv.30</td></tr></table></div><p>3部隊制圧で限定装備3個＋従来の追加装備1個＋専用陣1個。勝利時に受領済みの内容を、帰還報告でも確認できます。</p>';
if(tab==='collection')html='<h2>地域限定の装備と魔法陣</h2><div class="grid">'+data.relics.filter(selected).map(r=>'<article><small>'+esc(data.areas[r.area].name)+'・限定装備</small><b>'+esc(r.name)+'</b><p>'+esc(r.source)+'から毎回1個</p><details><summary>＋30の効果と組み合わせ</summary><p>'+esc(r.effect)+'</p><small>'+esc(r.hint)+'</small></details></article>').join('')+data.circles.filter(selected).map(c=>'<article><img alt="" src="../../'+(c.asset.startsWith('./')?c.asset.slice(2):c.asset)+'"><small>'+esc(data.areas[c.area].name)+'・専用陣</small><b>'+esc(c.name)+'</b><p>地域の精鋭3部隊制圧で毎周回1個</p><small>'+esc(c.summary)+'</small></article>').join('')+'</div>';
if(tab==='pairs')html='<h2>24組の連携と崩し方</h2><p class="note">通常戦闘で指定の2人が同じ陣営で生存中、通常攻撃・固有スキルの後に発動。各キャラにつき1ラウンド1回、1組で最大2回。追加MPなし。追撃から再発動せず、戦闘不能・捕獲・隔離・追加行動禁止・行動不能（睡眠・凍結など）で連携停止。</p><div class="grid">'+data.pairs.filter(selected).map(p=>'<article><small>'+esc(data.areas[p.area].name)+'</small><b>'+esc(p.name)+'</b><p>'+esc(p.names.join(' ＆ '))+'</p><p>'+esc(p.description)+'</p><details><summary>敵として現れたときの攻略</summary><p>'+esc(p.counterplay)+'</p><small>指定ペアの片方を行動不能にすると、その間の連携は停止します。毒・火傷・出血は、それ自体では連携を止めません。</small></details></article>').join('')+'</div>';
if(tab==='audit')html='<h2>Build395の検証記録</h2><p>'+esc(data.audit.method)+'</p><p class="note">'+esc(data.audit.limitations)+'</p><p>'+esc(data.audit.decision)+'</p><p>精鋭は全15部隊で、段階1→3の平均総HPが約1.71〜1.97倍へ上昇。敵の基本倍率・固有威力の一律変更は行っていません。</p><div class="table-wrap"><table><tr><th>部隊</th><th>段階</th><th>平均総HP</th><th>平均攻撃力</th></tr>'+data.audit.elite.filter(selected).map(e=>'<tr><td>'+esc(e.name)+'</td><td>'+e.tier+'</td><td>'+e.meanTotalHp.toLocaleString()+'</td><td>'+e.meanOffense.toLocaleString()+'</td></tr>').join('')+'</table></div><details><summary>追撃比較の条件</summary>'+Object.entries(data.audit.presets).map(([id,text])=>'<p><b>'+id+'</b>：'+esc(text)+'</p>').join('')+'</details><p><small>詳細な全数値：同じフォルダの balance-audit.json。ブラウザー／iPhone実機の描画・操作感と、完全自動戦闘の体感バランスは未確認です。</small></p>';
